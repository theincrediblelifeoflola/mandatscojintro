<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification de mandat — Cour de Justice - Etat de San Andreas</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;margin:0;padding:20px;}
    .container{max-width:900px;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);padding:40px;}
    h1{color:#1f3a5f;margin-top:0;text-align:center;}
    .status{padding:16px;border-radius:6px;margin-bottom:24px;text-align:center;font-weight:bold;}
    .status.valid{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
    .status.invalid{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
    .status.notfound{background:#fff3cd;color:#856404;border:1px solid #ffeeba;}
    .info-box{background:#f9f9f9;padding:12px;border-left:4px solid #ffc107;margin-bottom:16px;}
    .mandate-display{border:1px solid #ddd;border-radius:4px;padding:0;overflow:hidden;}
    .mandate-display iframe{width:100%;height:600px;border:none;display:block;}
    .footer{text-align:center;margin-top:32px;color:#666;font-size:12px;}
    .error{color:#c00;font-weight:bold;}
    input{width:100%;max-width:400px;padding:8px;margin-bottom:16px;border:1px solid #ccc;border-radius:4px;font-family:monospace;}
    button{background:#1f3a5f;color:#fff;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;}
    button:hover{background:#15263d;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Vérification d'authenticité de mandat</h1>
    
    <div id="search-section">
      <p style="text-align:center;">Entrez l'ID du mandat ou scannez son QR code :</p>
      <input type="text" id="mandate-id" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" style="text-align:center;">
      <div style="text-align:center;"><button onclick="verifyMandate()">Vérifier</button></div>
    </div>

    <div id="result" style="display:none;">
      <div id="status-box"></div>
      <div id="mandate-info"></div>
      <div id="mandate-display"></div>
    </div>
  </div>

  <script>
    function getParam(name){var url=new URL(window.location);return url.searchParams.get(name);}
    function escapeHtml(text){var div=document.createElement('div');div.textContent=text;return div.innerHTML;}

    function verifyMandate(){
      var id=document.getElementById('mandate-id').value.trim();
      if(!id){alert('Veuillez entrer un ID ou scannez un QR code');return;}
      displayMandate(id);
    }

    function displayMandate(uuid){
      var storage=window.localStorage||window.sessionStorage;
      var key='mandate:'+uuid;
      var stored=null;
      try{stored=JSON.parse(storage.getItem(key));}catch(e){}
      
      var resultDiv=document.getElementById('result');
      var statusBox=document.getElementById('status-box');
      var infoBox=document.getElementById('mandate-info');
      var displayBox=document.getElementById('mandate-display');
      
      resultDiv.style.display='block';
      
      if(!stored){
        statusBox.innerHTML='<div class="status notfound">⚠️ Mandat non trouvé</div>';
        infoBox.innerHTML='<p>Aucun mandat avec l\'ID <code>'+escapeHtml(uuid)+'</code> n\'a pu être trouvé dans la base de vérification.</p><p><small>Si vous avez scanné le QR code correctement, ce mandat n\'a peut-être pas été généré sur ce navigateur/appareil.</small></p>';
        displayBox.innerHTML='';
        return;
      }
      
      statusBox.innerHTML='<div class="status valid">✓ Mandat authentifié</div>';
      var date=new Date(stored.timestamp);
      var dateStr=date.toLocaleString('fr-FR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
      infoBox.innerHTML='<div class="info-box"><strong>ID du mandat :</strong> <code>'+escapeHtml(uuid)+'</code><br><strong>Généré le :</strong> '+dateStr+'<br><strong>Type :</strong> '+escapeHtml(stored.type||'unknown')+'</div>';
      
      displayBox.innerHTML='<div class="mandate-display"><iframe srcdoc="'+escapeHtml(stored.html)+'"></iframe></div>';
    }

    // Auto-verify if ID in URL
    var urlId=getParam('id');
    if(urlId){
      document.getElementById('mandate-id').value=urlId;
      displayMandate(urlId);
    }

    // Allow Enter key
    document.getElementById('mandate-id').addEventListener('keypress',function(e){if(e.key==='Enter')verifyMandate();});
  </script>
</body>
</html>
