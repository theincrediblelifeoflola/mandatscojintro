<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification d'un acte — Cour de Justice - Etat de San Andreas</title>
<style>
  :root{--navy:#1f2e4a;--gold:#b08a3e;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#eef0f4;color:#1b1b1b;}
  header{background:var(--navy);color:#fff;text-align:center;padding:22px 16px;border-bottom:3px solid var(--gold);}
  header h1{margin:0;font-size:20px;letter-spacing:.5px;}
  header p{margin:6px 0 0;font-style:italic;color:#d9dce4;font-size:14px;}
  main{max-width:860px;margin:24px auto;padding:0 14px;}
  .card{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:22px;margin-bottom:18px;}
  .search{display:flex;gap:8px;flex-wrap:wrap;}
  .search input{flex:1;min-width:220px;padding:10px;border:1px solid #c7ccd6;border-radius:4px;font-family:monospace;font-size:14px;}
  .search button{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:10px 18px;font-size:14px;cursor:pointer;}
  .status{padding:14px 16px;border-radius:5px;font-weight:bold;font-family:Arial,sans-serif;margin-bottom:16px;}
  .ok{background:#e3f4e8;color:#17602e;border:1px solid #b9e1c6;}
  .ko{background:#fbe7e7;color:#8a1c1c;border:1px solid #f0c2c2;}
  .wait{background:#f3f4f7;color:#444;border:1px solid #dde0e6;}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;}
  td{border:1px solid #dde0e6;padding:8px 10px;} td.k{background:#f4f5f8;font-weight:bold;color:var(--navy);width:38%;}
  .doc img{width:100%;height:auto;border:1px solid #dde0e6;display:block;}
  .note{font-size:12px;color:#666;margin-top:10px;font-family:Arial,sans-serif;}
</style>
</head>
<body>
<header>
  <h1>COUR DE JUSTICE - ETAT DE SAN ANDREAS</h1>
  <p>Bureau des Greffes — Vérification d'authenticité des actes</p>
</header>
<main>
  <div class="card">
    <div class="search">
      <input id="q" placeholder="Référence de l'acte (ex. SACOJ20260927-1)">
      <button id="go">Vérifier</button>
    </div>
  </div>
  <div id="out"></div>
</main>
<script>
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function frDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'');}
  var out=document.getElementById('out'), q=document.getElementById('q');

  var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  function check(v){
    v=(v||'').trim(); if(!v) return;
    var param=UUID.test(v)?'id':'ref';
    history.replaceState(null,'','?'+param+'='+encodeURIComponent(v));
    out.innerHTML='<div class="card"><div class="status wait">Vérification en cours…</div></div>';
    fetch('/api/mandates?'+param+'='+encodeURIComponent(v)).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){return {code:r.status,j:j};});
    }).then(function(x){
      if(x.code===200){
        var m=x.j.meta||{}, d=new Date(x.j.createdAt);
        var rows=[['Référence',m.reference],['Type d\'acte',m.type],['Date et heure de l\'acte',frDate(m.date)+(m.heure?' à '+m.heure.replace(':','h'):'')],
                  ['Affaire',m.affaire],['Personne visée',m.personne],['Magistrat signataire',m.magistrat],
                  ['Enregistré le',d.toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'})]]
                 .filter(function(r){return r[1];});
        out.innerHTML='<div class="card"><div class="status ok">✓ Acte authentique — enregistré au registre de la Cour</div>'+
          '<table>'+rows.map(function(r){return '<tr><td class="k">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+'</table>'+
          '<div class="doc"><img alt="Copie de l\'acte enregistré" src="'+x.j.image+'"></div>'+
          '<div class="note">Comparez le document qui vous a été présenté avec cette copie officielle. Toute différence signifie que le document a été modifié.</div></div>';
      } else if(x.code===404 || x.code===400){
        out.innerHTML='<div class="card"><div class="status ko">✗ Aucun acte ne correspond à cette référence</div>'+
          '<div class="note">Ce document n\'a pas été émis par la Cour de Justice ou son numéro a été altéré. Il doit être considéré comme non authentique.</div></div>';
      } else {
        out.innerHTML='<div class="card"><div class="status wait">Service de vérification momentanément indisponible. Réessayez plus tard.</div>'+
          '<div class="note">'+esc(x.j.error||('Erreur '+x.code))+'</div></div>';
      }
    }).catch(function(){
      out.innerHTML='<div class="card"><div class="status wait">Impossible de joindre le service de vérification. Vérifiez votre connexion.</div></div>';
    });
  }
  document.getElementById('go').addEventListener('click',function(){check(q.value);});
  q.addEventListener('keydown',function(e){if(e.key==='Enter')check(q.value);});
  var sp=new URLSearchParams(location.search), v0=sp.get('id')||sp.get('ref');
  if(v0){ q.value=sp.get('ref')?v0:''; check(v0); }
</script>
</body>
</html>
